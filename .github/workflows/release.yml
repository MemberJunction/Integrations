name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # create the Version Packages PR + per-connector git tags
      pull-requests: write
      id-token: write        # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Connector Open App invariants
        run: npm run lint:invariants

      # Guardrail for the "silent second layer" class: every templated list door
      # must resolve to a declared parent (PheedLoop shipped 21 objects that
      # silently fetched 0 rows — reviews/tests/builds could not see it).
      - name: Parent declarations resolvable
        run: node scripts/validate-parent-declarations.mjs

      # Better guessing beats trial-and-error: string sizing is empirical (a live
      # bio was 2,595 chars vs the 255 default and records SKIP, not truncate).
      # Prose fields at the raw default fail the build; url/email tiers advise.
      - name: Field lengths semantically sized
        run: node scripts/infer-field-lengths.mjs --check

      # Metadata is the AUTHORING layer only — tenants get catalog rows from
      # migrations (upgrades apply only NEW files). A metadata edit without a
      # new migration ships a fix that reaches nobody (the wave-1/2 lesson).
      - name: Metadata changes ship a migration
        run: node scripts/require-metadata-migration.mjs

      # Every metadata record fields.* key must map to a real entity column, a documented
      # framework-ideal field, or a grandfathered debt entry — no inert/typo'd fields that
      # SetLocal silently drops on push (concern A11).
      - name: Metadata fields on allowlist
        run: node scripts/lint-metadata-fields.mjs

      # Migrations: Flyway-named, monotonic per connector, and each has its converted PG variant.
      # pr.yml has always run this; release.yml did not, so a migration-shape defect that entered
      # `main` by any path other than a PR (back-merge, hotfix, admin push) reached publish unchecked.
      - name: Validate migrations
        run: node scripts/validate-migrations.mjs

      - name: PG migrations up to date
        run: node scripts/build-pg-migrations.mjs --check

      # connectors-catalog.json is what `mj app install` reads to resolve versions. `version-packages`
      # regenerates it after bumping versions, so on a released tree it must be in sync. Guards against the
      # stale-pin bug (installs kept resolving PheedLoop 1.0.0 after its fix shipped in a later version).
      - name: Connector catalog up to date
        run: node scripts/build-connectors-catalog.mjs --check

      # THE PUBLISH GATE. `npm run release` is `turbo run build && changeset publish` — it BUILDS but never
      # TESTS, and unit tests ran only in pr.yml's `validate`, which is not a required check. So a connector
      # whose tests were red could be merged and published: @memberjunction/connector-hubspot went live on
      # npm at 1.1.1 importing an undeclared dependency, and connector-constant-contact published 2.0.0
      # carrying three failing tests. Everything here runs UNFILTERED — `main` is the publish tree, so the
      # whole fleet must be green, not just what a diff says changed.
      - name: Build & test all connectors
        run: npx turbo run build test

      # Opens/updates the "Version Packages" PR; on merge, `npm run release` builds + publishes ONLY the
      # changed connector packages (changesets non-fixed → per-connector independent versions) and tags each
      # as <pkg>@<version>. `npm run version-packages` bumps versions AND syncs each connector's mj-app.json
      # (version + mjVersionRange) via scripts/sync-manifest-versions.mjs. The <pkg>@<version> tags are what
      # `mj app install .../<Category>/<Connector> --version X.Y.Z` resolves (scoped-tag resolution).
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # BACK-MERGE main -> next, AUTOMATICALLY.
      #
      # The release commit lands on `main` ONLY: Version Packages bumps versions, writes CHANGELOGs and
      # regenerates connectors-catalog.json there. `next` sends changes up and nothing comes back down, so
      # the instant a publish completes `next` is stale by exactly that commit. Three consequences, all
      # observed rather than theoretical:
      #
      #   1. catalog-freshness fails — it compares next's package.json against the newest tag. It failed
      #      every day from 2026-08-15 until someone reconciled Business Central by hand.
      #   2. The overview pages advertise the wrong version — they generate from `next`, so a connector
      #      shows the previous release while npm serves the new one.
      #   3. The next promotion conflicts, and the gap widens per release until a human resolves it. Four
      #      back-merge PRs were opened this way in twelve days (#147, #178, #186, #191) and only the last
      #      was merged.
      #
      # Opens a PR rather than pushing: protect-next is a PR-only ruleset with an empty bypass list, so
      # nothing — this workflow included — pushes to `next` directly.
      - name: Back-merge the release into next
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin next main
          if git merge-base --is-ancestor origin/main origin/next; then
            echo "next already contains main — nothing to back-merge."
            exit 0
          fi

          BRANCH="chore/backmerge-release-${GITHUB_RUN_ID}"
          git checkout -B "$BRANCH" origin/next

          # A conflict here is a real divergence a human must look at, not something to force through.
          if ! git merge origin/main --no-edit; then
            git merge --abort || true
            echo "::warning::main does not merge cleanly into next — open the back-merge by hand."
            exit 0
          fi

          if git diff --quiet origin/next -- .; then
            echo "merge produced no change — nothing to open."
            exit 0
          fi

          git push origin "$BRANCH"
          gh pr create --base next --head "$BRANCH" \
            --title "chore: back-merge the release into next" \
            --body "Automatic back-merge of \`main\` into \`next\` after a publish.

          The release commit lands on \`main\` only — Version Packages bumps versions, writes CHANGELOGs and
          regenerates \`connectors-catalog.json\` there. Without this, \`next\` is stale by exactly that commit,
          which makes \`catalog-freshness\` fail, makes the overview pages advertise the previous version, and
          widens the gap until the next promotion conflicts.

          Merged automatically by nothing — a human still reviews and merges. If it conflicts, the workflow
          leaves it alone and warns instead."
