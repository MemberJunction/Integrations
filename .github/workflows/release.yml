name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # create the Version Packages PR + per-connector git tags
      pull-requests: write
      id-token: write        # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Connector Open App invariants
        run: npm run lint:invariants

      # Guardrail for the "silent second layer" class: every templated list door
      # must resolve to a declared parent (PheedLoop shipped 21 objects that
      # silently fetched 0 rows — reviews/tests/builds could not see it).
      - name: Parent declarations resolvable
        run: node scripts/validate-parent-declarations.mjs

      # Better guessing beats trial-and-error: string sizing is empirical (a live
      # bio was 2,595 chars vs the 255 default and records SKIP, not truncate).
      # Prose fields at the raw default fail the build; url/email tiers advise.
      - name: Field lengths semantically sized
        run: node scripts/infer-field-lengths.mjs --check

      # Metadata is the AUTHORING layer only — tenants get catalog rows from
      # migrations (upgrades apply only NEW files). A metadata edit without a
      # new migration ships a fix that reaches nobody (the wave-1/2 lesson).
      - name: Metadata changes ship a migration
        run: node scripts/require-metadata-migration.mjs

      # Every metadata record fields.* key must map to a real entity column, a documented
      # framework-ideal field, or a grandfathered debt entry — no inert/typo'd fields that
      # SetLocal silently drops on push (concern A11).
      - name: Metadata fields on allowlist
        run: node scripts/lint-metadata-fields.mjs

      - name: PG migrations up to date
        run: node scripts/build-pg-migrations.mjs --check

      # connectors-catalog.json is what `mj app install` reads to resolve versions. `version-packages`
      # regenerates it after bumping versions, so on a released tree it must be in sync. Guards against the
      # stale-pin bug (installs kept resolving PheedLoop 1.0.0 after its fix shipped in a later version).
      - name: Connector catalog up to date
        run: node scripts/build-connectors-catalog.mjs --check

      # Opens/updates the "Version Packages" PR; on merge, `npm run release` builds + publishes ONLY the
      # changed connector packages (changesets non-fixed → per-connector independent versions) and tags each
      # as <pkg>@<version>. `npm run version-packages` bumps versions AND syncs each connector's mj-app.json
      # (version + mjVersionRange) via scripts/sync-manifest-versions.mjs. The <pkg>@<version> tags are what
      # `mj app install .../<Category>/<Connector> --version X.Y.Z` resolves (scoped-tag resolution).
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
