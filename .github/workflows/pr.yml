name: PR

on:
  pull_request:
    branches: [next, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo + changesets need history

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # Each connector Open App: full-Open-App shape (schema mj_connector_<name> + migrations + metadata),
      # owns its package, ClassName <-> ImportPath <-> @RegisterClass three-way invariant, mj-app.json Zod-valid.
      - name: Connector Open App invariants
        run: npm run lint:invariants

      # Guardrail for the "silent second layer" class: every templated list door
      # must resolve to a declared parent (PheedLoop shipped 21 objects that
      # silently fetched 0 rows — reviews/tests/builds could not see it).
      - name: Parent declarations resolvable
        run: node scripts/validate-parent-declarations.mjs

      # Same silent-failure family as the parent-declaration gate, on the WRITE
      # side: a writable object with no IsPrimaryKey field yields a keyless
      # derived entity, and on Postgres every save then fails with
      # `syntax error at or near ","` while fetch keeps succeeding — so the
      # connector reads as healthy and persists nothing (HubSpot #105 was one
      # instance). Ratcheted against scripts/writable-pk-baseline.json: the 86
      # pre-existing offenders are accepted, anything new fails, and a baselined
      # entry that has since been fixed must be removed from the file.
      - name: Writable objects declare a primary key
        run: npm run lint:writable-pk

      # Third member of the silent-truncation family: a connector with no
      # page-advance mechanism returns `HasMore: false` on page ONE, so every
      # object caps at a single page with a green run and a plausible row count.
      # GrowthZone shipped that way across all 17 objects (`skip` vs `$skip`).
      - name: Connectors reporting HasMore:false can advance a page
        run: npm run lint:pagination

      # Better guessing beats trial-and-error: string sizing is empirical (a live
      # bio was 2,595 chars vs the 255 default and records SKIP, not truncate).
      # Prose fields at the raw default fail the build; url/email tiers advise.
      - name: Field lengths semantically sized
        run: node scripts/infer-field-lengths.mjs --check

      # Metadata is the AUTHORING layer only — tenants get catalog rows from
      # migrations (upgrades apply only NEW files). A metadata edit without a
      # new migration ships a fix that reaches nobody (the wave-1/2 lesson).
      - name: Metadata changes ship a migration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/require-metadata-migration.mjs

      # Every metadata record fields.* key must map to a REAL entity column (proven by the
      # spCreate* @Params in generated migrations), a documented framework-ideal field, or a
      # grandfathered debt entry. Catches inert/typo'd fields that BaseEntity.SetLocal silently
      # drops on push — so a green check can't confirm a declaration the code never deploys
      # (concern A11: e.g. Integration.APIBaseURL is not a column; NavigationBaseURL is).
      - name: Metadata fields on allowlist
        run: node scripts/lint-metadata-fields.mjs --audit

      # Migrations: Flyway-named, monotonic per connector, and each has its converted PG variant.
      - name: Validate migrations
        run: node scripts/validate-migrations.mjs

      - name: PG migrations up to date
        run: node scripts/build-pg-migrations.mjs --check

      # connectors-catalog.json is what `mj app install` reads to resolve versions. It is GENERATED from
      # each connector's package.json — when it drifts, installs pin a stale version (PheedLoop shipped its
      # parent-declaration fix but instances kept installing the pre-fix 1.0.0 because the catalog was never
      # regenerated). Fail the PR if it is out of date so drift can never reach an install again.
      - name: Connector catalog up to date
        run: node scripts/build-connectors-catalog.mjs --check

      # Build + unit-test only the connectors a PR touches (and their dependents, e.g. Fonteva when Salesforce changes).
      - name: Build & test changed connectors
        run: npx turbo run build test --filter='...[origin/${{ github.base_ref }}]'

      # A changeset is required ONLY for an ALREADY-PUBLISHED connector that changed (its version is on
      # npm, so shipping the change needs a bump). New/unpublished connectors ship via the no-changeset
      # publish path, so they don't need one — npm-aware gate (replaces the blanket `changeset status`,
      # which false-failed every connector change). Red iff a real problem, green otherwise.
      - name: Require changeset (npm-aware)
        run: node scripts/require-changeset.mjs origin/${{ github.base_ref }}
