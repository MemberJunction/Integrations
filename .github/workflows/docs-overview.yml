# Regenerate the two fleet overview pages after every publish, then sync them back to `next`.
#
# WHY THIS RUNS ON main AND NOT ON PRs
# docs/marketing.html and docs/technical.html embed package versions from connectors-catalog.json.
# Those versions are bumped by the changesets "Version Packages" PR, which lands on `main` — so the
# pages are only correct once that merge exists. A PR to `next` opened between a release and its
# back-merge would see stale versions, which is exactly the state catalog-freshness.yml already
# tracks as expected-red. Gating PRs on page freshness would therefore fail for reasons the PR
# author neither caused nor can fix. pr.yml instead runs `--parse-only`, which depends only on files
# in the PR's own tree and so cannot flake.
#
# WHY THE BACK-MERGE STEP EXISTS
# `next` is the default branch and all work flows next -> main. These two files are the only
# artifacts generated ON main, so without a merge back they would conflict with, or be silently
# reverted by, the next promotion. The repo already has this pattern by hand (the
# backmerge/main-to-next-* branches); this automates it for the docs commit.
#
# WHY THIS DOES NOT LOOP
# Two independent guards. First, the generator is deterministic — it derives every date from its
# inputs rather than the clock — so a run that changes nothing writes nothing and the commit step
# is skipped entirely. Second, a push made with the default GITHUB_TOKEN does not trigger workflow
# runs, and the commit is additionally marked [skip ci]. Either alone would be sufficient.
#
# ORDERING vs release.yml: both fire on the same push to main, and they do not race. The version
# bumps this generator reads arrive as tree content when the Version Packages PR is merged — that
# merge IS the push event, so this run already sees the fresh catalog. release.yml's publish leg
# writes npm packages, git tags and GitHub releases, none of which are inputs here.
#
# SETUP PREREQUISITE: branch protection on `main` (and ideally `next`) must permit
# github-actions[bot] to push. If it does not, the commit step fails and the back-merge falls back
# to opening a PR — see the fallback in the last step.

name: Marketing copy for new connectors

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: docs-overview-${{ github.ref }}
  cancel-in-progress: false # never kill a half-finished back-merge

permissions:
  contents: write # push the copy branch (protected branches are never pushed to directly)
  pull-requests: write # open the PR that carries the copy to next

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the back-merge needs real history, not a shallow clone

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Needed only by the copywriting step below — the generator itself is dependency-free.
      - name: Install
        run: npm ci

      # React to what the merge actually changed. Everything structural (a new connector, a version
      # bump, a new evidence tier, changed counts) the generator derives on its own; the one thing it
      # cannot derive is the sentence a prospect reads, so a newly added connector would otherwise
      # land engineer-jargon on the marketing page. This writes that line once and commits it to
      # docs/data/marketing-names.json, which is what keeps regeneration byte-stable afterwards.
      #
      # Without ANTHROPIC_API_KEY the step is a no-op (exit 0) and the generator falls back to
      # trimming the catalog description — worse copy, still a correct page.
      - name: Write marketing copy for new connectors
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/ai-marketing-copy.mjs

      # OPEN A PR — DO NOT PUSH.
      #
      # `protect-main` and `protect-next` are both PR-only rulesets with an EMPTY bypass list, so no
      # actor can push directly to either branch — github-actions[bot] included. The previous version
      # of this step pushed to main and failed the moment it actually had something to commit
      # (Version Packages #183: a new connector arrived, copy was written, push rejected).
      #
      # The PR targets `next` rather than `main`: marketing-names.json is an input, next is where
      # inputs live, and the overview pages regenerate from next. It reaches main on the next
      # promotion like everything else.
      #
      # A review step is a feature here, not a tax — this is model-written prose that goes in front of
      # prospects, and a human glancing at one sentence per new connector is cheap insurance.
      - name: Open a PR if the copy changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COPY="docs/data/marketing-names.json"
          if git diff --quiet -- "$COPY"; then
            echo "No change — every catalog connector already has marketing copy."
            exit 0
          fi

          BRANCH="docs/marketing-copy-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Branch from next, carrying only the copy file: this run checked out main, and committing
          # its whole tree onto next would drag unrelated release state along with the one file we mean.
          git stash push -- "$COPY"
          git fetch origin next
          git checkout -B "$BRANCH" origin/next
          git stash pop

          if git diff --quiet -- "$COPY"; then
            echo "next already has this copy — nothing to open."
            exit 0
          fi

          git add "$COPY"
          git commit -m "docs: marketing copy for newly added connectors"
          git push origin "$BRANCH"

          gh pr create --base next --head "$BRANCH" \
            --title "docs: marketing copy for newly added connectors" \
            --body "One or more connectors reached the catalog without a prospect-facing line, so
          \`scripts/ai-marketing-copy.mjs\` wrote one for each.

          **Please read the sentences.** They are model-written and appear on the client-facing
          overview page. Check they claim only what the connector does, name records in the words a
          member would use, and avoid protocol or auth vocabulary.

          Merging pins the copy: the pages generate from this file, so regeneration stays byte-stable
          and the model is not consulted for these connectors again unless their source description
          changes."
